<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2e7d32">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<title>Tomato Leaf Doctor</title>
<style>
:root{--bg:#f6f8f4;--card:#fff;--text:#1b2a1b;--muted:#5d6b5d;--green:#2e7d32;--on:#fff;--bar:#e3eadf;--warn:#b26a00}
@media (prefers-color-scheme:dark){:root{--bg:#121812;--card:#1b241b;--text:#e8f0e8;--muted:#9bab9b;--green:#66bb6a;--on:#0b1f0b;--bar:#2b382b;--warn:#ffb74d}}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Roboto,sans-serif;background:var(--bg);color:var(--text);padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom)}
main{max-width:480px;margin:0 auto;padding:16px 0}
h1{font-size:1.4rem;margin:8px 0 4px}
.sub{color:var(--muted);margin:0 0 16px;font-size:.9rem}
.card{background:var(--card);border-radius:16px;padding:16px;margin-bottom:16px;box-shadow:0 1px 4px #0002}
#preview{width:100%;max-height:320px;object-fit:contain;border-radius:12px;display:none;margin-bottom:12px}
.btns{display:flex;gap:8px}
.btn{flex:1;text-align:center;padding:14px 8px;border-radius:12px;background:var(--green);color:var(--on);font-weight:600;cursor:pointer;font-size:1rem}
.btn.alt{background:transparent;color:var(--green);border:2px solid var(--green)}
input[type=file]{display:none}
#status{color:var(--muted);font-size:.85rem;margin-top:10px}
.row{margin:12px 0}
.top{display:flex;justify-content:space-between;font-weight:600}
.bar{height:8px;background:var(--bar);border-radius:4px;margin-top:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--green)}
#warn{color:var(--warn);font-size:.9rem;margin-top:8px}
.note{color:var(--muted);font-size:.75rem;text-align:center}
</style>
</head>
<body>
<main>
  <h1>🍅 Tomato Leaf Doctor</h1>
  <p class="sub">CNN trained on 61,694 images across 11 classes. Photograph one leaf in good light.</p>
  <div class="card">
    <img id="preview" alt="Selected leaf">
    <div class="btns">
      <label class="btn">📷 Take photo<input id="cam" type="file" accept="image/*" capture="environment"></label>
      <label class="btn alt">🖼️ Gallery<input id="gal" type="file" accept="image/*"></label>
    </div>
    <div id="status">Loading model…</div>
  </div>
  <div class="card" id="resultCard" style="display:none">
    <div id="results"></div>
    <div id="warn"></div>
  </div>
  <p class="note">Educational demo. Not a substitute for expert diagnosis.</p>
</main>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>
<script>
const RESCALE = true;            // matches the Colab app (pixels / 255)
let model, classes, size = 224;
const $ = id => document.getElementById(id);
const clean = n => n.replace(/_+/g, ' ').replace(/^Tomato\s+/i, '').trim();

async function init() {
  try {
    classes = await (await fetch('classes.json')).json();
    try { model = await tf.loadLayersModel('model/model.json'); }
    catch (e) { model = await tf.loadGraphModel('model/model.json'); }
    const s = model.inputs && model.inputs[0].shape;
    if (s && s[1]) size = s[1];
    $('status').textContent = 'Model ready. Take or choose a photo.';
  } catch (e) {
    $('status').textContent = 'Could not load model: ' + e.message;
  }
}

function classify(img) {
  const probs = tf.tidy(() => {
    let x = tf.browser.fromPixels(img).resizeBilinear([size, size]).toFloat();
    if (RESCALE) x = x.div(255);
    return Array.from(model.predict(x.expandDims(0)).dataSync());
  });
  const top = probs.map((p, i) => [classes[i], p]).sort((a, b) => b[1] - a[1]).slice(0, 3);
  $('results').innerHTML = top.map(([n, p]) =>
    `<div class="row"><div class="top"><span>${clean(n)}</span><span>${(p * 100).toFixed(1)}%</span></div>
     <div class="bar"><i style="width:${(p * 100).toFixed(1)}%"></i></div></div>`).join('');
  $('warn').textContent = top[0][1] < 0.6 ? 'Low confidence. Try a clearer, closer photo of a single leaf.' : '';
  $('resultCard').style.display = 'block';
  $('status').textContent = 'Done.';
}

function onFile(e) {
  const f = e.target.files[0];
  if (!f) return;
  if (!model) { $('status').textContent = 'Model not loaded yet.'; return; }
  const img = $('preview');
  img.onload = () => { $('status').textContent = 'Analysing…'; setTimeout(() => classify(img), 30); };
  img.src = URL.createObjectURL(f);
  img.style.display = 'block';
  e.target.value = '';
}
$('cam').addEventListener('change', onFile);
$('gal').addEventListener('change', onFile);
init();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
